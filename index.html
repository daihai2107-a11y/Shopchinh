<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHN Express - Quản Lý Đơn Hàng Toàn Quốc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ghn: { orange: '#FA5400', dark: '#002D62', hover: '#D94800' } } } }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">

    <header class="bg-ghn-dark text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <span class="font-extrabold text-ghn-orange text-base md:text-lg tracking-wider">GHN <span class="text-white">ADMIN PRO</span></span>
            <div class="flex space-x-1 md:space-x-2 items-center">
                <button onclick="switchTab('shop')" id="btn-shop" class="px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-ghn-orange text-white transition">Tạo Đơn</button>
                <button onclick="switchTab('admin')" id="btn-admin" class="px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-gray-800 text-gray-300 transition">Quản Lý Đơn</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">
        <!-- TAB 1: TẠO ĐƠN -->
        <div id="tab-shop" class="space-y-6">
            <div class="bg-white p-5 md:p-8 rounded-2xl shadow-sm space-y-4">
                <h2 class="text-xl font-bold text-ghn-dark border-b pb-3"><i class="fa-solid fa-cart-plus text-ghn-orange mr-2"></i>Tạo Đơn Hàng Mới</h2>
                
                <form onsubmit="createOrder(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Tên Chủ Shop / Kho xuất</label>
                        <input type="text" id="shop-name" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:border-ghn-orange" placeholder="Kho GHN Miền Bắc">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1">Tên Người Nhận</label>
                            <input type="text" id="rec-name" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:border-ghn-orange" placeholder="Nguyễn Văn A">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">SĐT Người Nhận</label>
                            <input type="tel" id="rec-phone" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:border-ghn-orange" placeholder="0987654321">
                        </div>
                    </div>

                    <!-- ĐỊA CHỈ HÀNH CHÍNH TOÀN QUỐC -->
                    <div class="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <label class="block text-sm font-bold text-ghn-dark"><i class="fa-solid fa-location-dot text-ghn-orange mr-1"></i> Địa Chỉ Giao Hàng</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Tỉnh / Thành phố:</label>
                                <select id="province" class="w-full px-3 py-2.5 border rounded-xl bg-white text-sm outline-none focus:border-ghn-orange font-medium" required>
                                    <option value="">-- Chọn Tỉnh/Thành --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Quận / Huyện:</label>
                                <select id="district" class="w-full px-3 py-2.5 border rounded-xl bg-white text-sm outline-none focus:border-ghn-orange font-medium" required>
                                    <option value="">-- Chọn Quận/Huyện --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Phường / Xã:</label>
                                <select id="ward" class="w-full px-3 py-2.5 border rounded-xl bg-white text-sm outline-none focus:border-ghn-orange font-medium" required>
                                    <option value="">-- Chọn Phường/Xã --</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Số nhà, tên đường cụ thể:</label>
                            <input type="text" id="rec-street" required class="w-full px-4 py-2.5 border rounded-xl bg-white outline-none focus:border-ghn-orange text-sm" placeholder="Ví dụ: Số 123 Đường Trần Phú">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1">Tiền COD (VNĐ)</label>
                            <input type="number" id="order-cod" value="200000" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:border-ghn-orange">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">Dự kiến nhận hàng</label>
                            <input type="text" id="order-est" value="2-3 ngày tới" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:border-ghn-orange" placeholder="VD: 18/10/2026">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="w-full bg-ghn-orange text-white py-3.5 rounded-xl font-bold shadow hover:bg-ghn-hover transition text-base">
                        LƯU VÀ TẠO ĐƠN HÀNG
                    </button>
                </form>
            </div>

            <div id="success-box" class="hidden bg-white p-5 rounded-2xl shadow-sm space-y-3 border-2 border-green-500">
                <h3 class="font-bold text-green-600 text-base"><i class="fa-solid fa-circle-check mr-1"></i> Tạo đơn thành công!</h3>
                <p class="text-sm text-gray-600">Mã vận đơn: <b id="new-id" class="text-ghn-orange font-bold text-xl"></b></p>
            </div>
        </div>

        <!-- TAB 2: QUẢN LÝ ĐƠN -->
        <div id="tab-admin" class="space-y-6 hidden">
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-xl font-bold text-ghn-dark"><i class="fa-solid fa-sliders text-ghn-orange mr-2"></i>Quản Lý & Cập Nhật Đơn Hàng</h2>
                    <button onclick="fetchOrders()" class="bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold transition"><i class="fa-solid fa-rotate mr-1"></i> Làm mới</button>
                </div>
                <div id="orders-container" class="space-y-4">
                    <p class="text-center text-gray-400 py-6">Đang tải danh sách đơn...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const BIN_ID = "6acfd2e1ac6210605a31bdc0";
        const MASTER_KEY = "$2a$10$.xgqmeAMF8gOzGP.UlKBKu79bsP7f9GxYcPjARVOH6ZFouK5wdAz.";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let host = "https://provinces.open-api.vn/api/";
        let ordersList = [];

        async function loadProvinces() {
            try {
                let response = await fetch(host + "?depth=1");
                let data = await response.json();
                let provinceSelect = document.getElementById('province');
                data.forEach(prov => {
                    provinceSelect.innerHTML += `<option value="${prov.name}" data-code="${prov.code}">${prov.name}</option>`;
                });
            } catch(e) { console.error(e); }
        }

        document.getElementById('province').addEventListener('change', async function() {
            let provinceCode = this.options[this.selectedIndex].getAttribute('data-code');
            let districtSelect = document.getElementById('district');
            let wardSelect = document.getElementById('ward');
            districtSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
            if (provinceCode) {
                let res = await fetch(host + "p/" + provinceCode + "?depth=2");
                let data = await res.json();
                data.districts.forEach(dist => {
                    districtSelect.innerHTML += `<option value="${dist.name}" data-code="${dist.code}">${dist.name}</option>`;
                });
            }
        });

        document.getElementById('district').addEventListener('change', async function() {
            let districtCode = this.options[this.selectedIndex].getAttribute('data-code');
            let wardSelect = document.getElementById('ward');
            wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
            if (districtCode) {
                let res = await fetch(host + "d/" + districtCode + "?depth=2");
                let data = await res.json();
                data.wards.forEach(ward => {
                    wardSelect.innerHTML += `<option value="${ward.name}">${ward.name}</option>`;
                });
            }
        });

        window.addEventListener('DOMContentLoaded', () => { loadProvinces(); fetchOrders(); });

        function switchTab(tab) {
            document.getElementById('tab-shop').classList.toggle('hidden', tab !== 'shop');
            document.getElementById('tab-admin').classList.toggle('hidden', tab !== 'admin');
            document.getElementById('btn-shop').className = tab === 'shop' ? 'px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-ghn-orange text-white transition' : 'px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-gray-800 text-gray-300 transition';
            document.getElementById('btn-admin').className = tab === 'admin' ? 'px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-ghn-orange text-white transition' : 'px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-gray-800 text-gray-300 transition';
            if(tab === 'admin') fetchOrders();
        }

        async function fetchOrders() {
            try {
                let res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } });
                let data = await res.json();
                ordersList = data.record.orders || [];
                renderOrders();
            } catch(e) { console.error(e); }
        }

        async function createOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerText = "Đang lưu lên đám mây...";
            btn.disabled = true;

            const street = document.getElementById('rec-street').value;
            const ward = document.getElementById('ward').value;
            const district = document.getElementById('district').value;
            const province = document.getElementById('province').value;
            const fullAddress = `${street}, ${ward}, ${district}, ${province}`;

            const newOrder = {
                id: 'GHN' + Math.floor(100000 + Math.random() * 900000),
                shopName: document.getElementById('shop-name').value,
                receiverName: document.getElementById('rec-name').value,
                receiverPhone: document.getElementById('rec-phone').value,
                receiverAddress: fullAddress,
                cod: Number(document.getElementById('order-cod').value),
                estimatedDate: document.getElementById('order-est').value,
                status: 'Chờ lấy hàng',
                location: 'Đã tạo đơn hàng thành công tại kho, chờ bưu tá qua lấy',
                timestamp: new Date().toLocaleString('vi-VN')
            };

            ordersList.unshift(newOrder);

            try {
                let res = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                    body: JSON.stringify({ orders: ordersList })
                });
                if(res.ok) {
                    btn.innerText = "LƯU VÀ TẠO ĐƠN HÀNG";
                    btn.disabled = false;
                    document.getElementById('new-id').innerText = newOrder.id;
                    document.getElementById('success-box').classList.remove('hidden');
                    e.target.reset();
                    fetchOrders();
                }
            } catch(err) {
                alert('Lỗi lưu đơn hàng!');
                btn.disabled = false;
            }
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            if (ordersList.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-6">Chưa có đơn hàng nào.</p>`;
                return;
            }

            container.innerHTML = ordersList.map(o => `
                <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl space-y-3 shadow-sm">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-gray-400">Mã vận đơn:</span>
                            <h4 class="font-extrabold text-ghn-orange text-base">${o.id}</h4>
                            <span class="text-xs text-gray-500 block"><b>Người nhận:</b> ${o.receiverName} (${o.receiverPhone}) - <b>COD:</b> ${Number(o.cod).toLocaleString()}đ</span>
                        </div>
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold ${o.status === 'Giao thành công' ? 'bg-green-100 text-green-800' : (o.status === 'Đang giao hàng' ? 'bg-blue-100 text-blue-800' : 'bg-yellow-100 text-yellow-800')}">${o.status}</span>
                    </div>

                    <!-- Ô QUẢN LÝ SỬA ĐỊA CHỈ, HÀNH TRÌNH, NGÀY GIỜ VÀ DỰ KIẾN NHẬN -->
                    <div class="text-xs space-y-2 bg-white p-3 rounded-lg border">
                        <div>
                            <label class="font-bold text-gray-500 block mb-1">Cập nhật Địa chỉ giao hàng:</label>
                            <input type="text" id="address-${o.id}" value="${o.receiverAddress}" class="w-full px-2.5 py-1.5 border rounded bg-gray-50 text-xs">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <div>
                                <label class="font-bold text-gray-500 block mb-1">Hành trình / Vị trí:</label>
                                <input type="text" id="loc-${o.id}" value="${o.location}" class="w-full px-2.5 py-1.5 border rounded bg-orange-50 text-ghn-dark font-semibold text-xs">
                            </div>
                            <div>
                                <label class="font-bold text-gray-500 block mb-1">Ngày giờ cập nhật:</label>
                                <input type="text" id="time-${o.id}" value="${o.timestamp}" class="w-full px-2.5 py-1.5 border rounded bg-gray-50 text-xs">
                            </div>
                            <div>
                                <label class="font-bold text-gray-500 block mb-1">Dự kiến nhận hàng:</label>
                                <input type="text" id="est-${o.id}" value="${o.estimatedDate || '2-3 ngày'}" class="w-full px-2.5 py-1.5 border rounded bg-green-50 font-semibold text-xs">
                            </div>
                        </div>
                    </div>

                    <!-- NÚT LƯU VÀ ĐỔI TRẠNG THÁI -->
                    <div class="pt-1 flex flex-wrap gap-2 items-center justify-between">
                        <button onclick="saveEdit('${o.id}')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-900 text-white rounded-lg text-xs font-bold transition"><i class="fa-solid fa-pen-to-square mr-1"></i> Lưu thay đổi</button>
                        
                        <div class="flex gap-1.5">
                            <button onclick="updateStatus('${o.id}', 'Chờ lấy hàng')" class="px-2.5 py-1.5 bg-yellow-500 text-white rounded-lg text-xs font-bold">Chờ lấy</button>
                            <button onclick="updateStatus('${o.id}', 'Đang giao hàng')" class="px-2.5 py-1.5 bg-blue-500 text-white rounded-lg text-xs font-bold">Đang giao</button>
                            <button onclick="updateStatus('${o.id}', 'Giao thành công')" class="px-2.5 py-1.5 bg-green-500 text-white rounded-lg text-xs font-bold">Thành công</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function saveEdit(id) {
            const item = ordersList.find(x => x.id === id);
            if(item) {
                item.receiverAddress = document.getElementById(`address-${id}`).value;
                item.location = document.getElementById(`loc-${id}`).value;
                item.timestamp = document.getElementById(`time-${id}`).value;
                item.estimatedDate = document.getElementById(`est-${id}`).value;
            }

            let res = await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify({ orders: ordersList })
            });
            if(res.ok) {
                alert(`Đã cập nhật đơn hàng ${id} thành công!`);
                fetchOrders();
            }
        }

        async function updateStatus(id, newStatus) {
            const item = ordersList.find(x => x.id === id);
            if(item) {
                item.status = newStatus;
            }
            saveEdit(id);
        }
    </script>
</body>
</html>
